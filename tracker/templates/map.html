<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Location Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0e1014;
      --bg-elev: #171a21;
      --bg-elev-2: #1f232c;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --text-dim: #9aa3b2;
      --accent: #4ade80;
      --accent-dim: #2f9e5b;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    #app { display: flex; flex-direction: column; height: 100vh; }

    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; background: var(--bg-elev); border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    header.topbar .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 16px; letter-spacing: .2px; }
    header.topbar .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    header.topbar nav a { color: var(--text-dim); text-decoration: none; margin-left: 18px; font-size: 14px; transition: color .15s; }
    header.topbar nav a:hover { color: var(--text); }

    main { display: flex; flex: 1 1 auto; min-height: 0; }
    #map { flex: 1 1 auto; min-width: 0; position: relative; background: #0b0d11; }

    /* Sidebar */
    #sidebar {
      width: 320px; flex: 0 0 320px; background: var(--bg-elev);
      border-right: 1px solid var(--border); overflow-y: auto;
      display: none;
    }
    body.has-sidebar #sidebar { display: block; }

    #sidebar .filters { padding: 16px; border-bottom: 1px solid var(--border); }
    #sidebar .filters h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--text); }
    #sidebar .filters label { display: block; font-size: 12px; color: var(--text-dim); margin: 8px 0 4px; }
    #sidebar .filters select, #sidebar .filters input {
      width: 100%; padding: 8px 10px; background: var(--bg-elev-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-family: var(--font); font-size: 13px;
    }
    #sidebar .filters .row { display: flex; gap: 8px; }
    #sidebar .filters .row > * { flex: 1; }
    #sidebar .filters button {
      width: 100%; margin-top: 12px; padding: 9px; background: var(--accent-dim); color: #fff;
      border: none; border-radius: 6px; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    #sidebar .filters button:hover { background: var(--accent); }
    #sidebar .filters button.secondary {
      background: var(--bg-elev-2); color: var(--text-dim); border: 1px solid var(--border); margin-top: 6px;
    }
    #sidebar .filters button.secondary:hover { border-color: var(--accent-dim); color: var(--text); }

    #sidebar .results { padding: 0; }
    #sidebar .results .item {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    #sidebar .results .item .title { font-size: 13px; font-weight: 500; }
    #sidebar .results .item .sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .leaflet-popup-content-wrapper { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    .leaflet-popup-tip { background: var(--bg-elev-2); border: 1px solid var(--border); }
    .leaflet-popup-content { margin: 14px 16px; font-family: var(--font); }
    .leaflet-popup-close-button { color: var(--text-dim) !important; top: 10px !important; right: 10px !important; }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    .popup { min-width: 220px; }
    .popup .name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
    .popup .row { display: flex; justify-content: space-between; gap: 14px; margin: 5px 0; font-size: 13px; }
    .popup .row .k { color: var(--text-dim); }
    .popup .row .v { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
    .popup .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim); }
    .popup .badge.google_wifi { color: var(--accent); border-color: var(--accent-dim); }
    .popup .badge.gps { color: var(--warn); border-color: #b97309; }
    .popup .divider { height: 1px; background: var(--border); margin: 10px 0; }
    .popup button {
      width: 100%; padding: 9px 12px; margin-top: 4px; cursor: pointer;
      background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .popup button:hover { background: var(--bg-elev-2); border-color: var(--accent-dim); }
    .popup .status { font-size: 12px; color: var(--text-dim); margin-top: 6px; min-height: 16px; text-align: center; }

    .dev-label { background: rgba(23,26,33,.85); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,.4); backdrop-filter: blur(4px); white-space: nowrap; }
    .leaflet-tooltip.dev-label:before { display: none; }

    .leaflet-control-zoom a { background: var(--bg-elev-2) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg-elev) !important; }
    .leaflet-control-attribution { background: rgba(14,16,20,.8) !important; color: var(--text-dim) !important; }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--text-dim); pointer-events: none; }
    .empty .big { color: var(--text); font-size: 17px; font-weight: 500; }

    #showAllBtn {
      display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 8px 16px; cursor: pointer;
      background: var(--bg-elev); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    #showAllBtn:hover { background: var(--bg-elev-2); border-color: var(--accent-dim); }
  </style>
</head>
<body class="has-sidebar">
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="dot"></span> Location Tracker</div>
      <nav>
        <a href="#" id="toggleFilters">Route Search</a>
        <a href="/device-map/">Device Map</a>
        <a href="/register/">Register device</a>
        <a href="/admin/">Admin</a>
      </nav>
    </header>
    <main>
      <div id="sidebar">
        <div class="filters">
          <h3>Client Route Search</h3>
          <label for="f_device">Client device</label>
          <select id="f_device">
            <option value="">All clients</option>
          </select>

          <div class="row">
            <div>
              <label for="f_from">Date from</label>
              <input type="datetime-local" id="f_from" />
            </div>
            <div>
              <label for="f_to">Date to</label>
              <input type="datetime-local" id="f_to" />
            </div>
          </div>

          <button id="btnTraceRoute">Trace Route</button>
          <button class="secondary" id="btnFastRoute">Fast Route (24h)</button>
          <button class="secondary" id="btnClearRoute">Clear route</button>
          <button class="secondary" id="btnCloseSidebar">Close sidebar</button>
        </div>
        <div class="results" id="routeResults">
          <div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">
            Filter by client and date range, then click "Trace Route" to draw
            each client's path on the map.
          </div>
        </div>
      </div>
      <div id="map"></div>
      <button id="showAllBtn">← Show All</button>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const locations = {{ locations_json|safe }};
    const clientDevices = {{ client_devices_json|safe }};
    const csrftoken = "{{ csrf_token }}";

    const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);
    requestAnimationFrame(() => map.invalidateSize());

    // Populate client device dropdown
    const f_device = document.getElementById('f_device');
    clientDevices.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.device_id; opt.textContent = d.name;
      f_device.appendChild(opt);
    });

    const emptyEl = document.getElementById('empty');
    if (!locations.length) { emptyEl.style.display = 'flex'; }

    function fmtTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      const diff = (Date.now() - d.getTime()) / 1000;
      if (diff < 60) return `${Math.max(1,Math.floor(diff))}s ago`;
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return d.toLocaleString();
    }

    function triggerLocation(deviceId, statusEl) {
      statusEl.textContent = 'Requesting...';
      fetch(`/api/trigger/${deviceId}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': csrftoken },
        credentials: 'same-origin',
      }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(data => {
        statusEl.textContent = data.status === 'queued' ? 'Request queued — device will respond on its next poll.' : ('Unexpected: ' + JSON.stringify(data));
      }).catch(err => {
        statusEl.textContent = 'Error: ' + err.message + ' (are you logged in as staff?)';
      });
    }

    // --- Default markers (latest position per device) ---
    let defaultMarkers = [];
    const bounds = [];

    function renderDefaultMarkers() {
      defaultMarkers.forEach(m => map.removeLayer(m));
      defaultMarkers = [];
      bounds.length = 0;

      locations.forEach((item) => {
        if (item.latitude == null || item.longitude == null) return;
        const fresh = item.received_at && (Date.now() - new Date(item.received_at).getTime() < 5 * 60 * 1000);
        const color = fresh ? '#4ade80' : '#ef4444';
        const marker = L.circleMarker([item.latitude, item.longitude], {
          color: color, fillColor: color, fillOpacity: 0.85, radius: 8, weight: 2
        }).addTo(map);

        marker.bindTooltip(item.name || item.device_id, {
          permanent: true, direction: 'right', offset: [10, 0], className: 'dev-label'
        });

        const srcLabel = item.location_source === 'google_wifi' ? 'Google WiFi' : 'GPS fallback';
        const popupHtml = `
          <div class="popup">
            <div class="name">${item.name || 'Unnamed device'}</div>
            <div class="row"><span class="k">Position</span><span class="v">${item.latitude.toFixed(5)}, ${item.longitude.toFixed(5)}</span></div>
            <div class="row"><span class="k">Accuracy</span><span class="v">${item.accuracy != null ? item.accuracy.toFixed(1) + ' m' : '—'}</span></div>
            <div class="row"><span class="k">Reported</span><span class="v">${fmtTime(item.timestamp)}</span></div>
            <div class="row"><span class="k">Received</span><span class="v">${fmtTime(item.received_at)}</span></div>
            <div class="row"><span class="k">Trigger</span><span class="v">${item.triggered_by || '—'}</span></div>
            <div class="row"><span class="k">Source</span><span class="v"><span class="badge ${item.location_source || 'gps'}">${srcLabel}</span></span></div>
            <div class="row"><span class="k">Privacy</span><span class="v">${item.privacy_until ? 'until ' + new Date(item.privacy_until).toLocaleString() : 'inactive'}</span></div>
            <div class="row"><span class="k">Requested</span><span class="v">${item.request_time ? fmtTime(item.request_time) + (item.request_pending ? ' (pending)' : ' (fulfilled)') : 'never'}</span></div>
            <div class="divider"></div>
            <button onclick="triggerLocation('${item.device_id}', this.nextElementSibling)">Request location now</button>
            <div class="status"></div>
          </div>`;
        marker.bindPopup(popupHtml, { minWidth: 240 });
        defaultMarkers.push(marker);
        bounds.push([item.latitude, item.longitude]);
      });

      if (bounds.length === 1) map.setView(bounds[0], 15);
      else if (bounds.length > 1) map.fitBounds(bounds, { padding: [60, 60] });
    }

    renderDefaultMarkers();

    // --- Route trace mode ---
    let routeLayers = [];
    let routeMarkers = [];

    function clearRoute() {
      routeLayers.forEach(l => map.removeLayer(l));
      routeMarkers.forEach(m => map.removeLayer(m));
      routeLayers = [];
      routeMarkers = [];
    }

    function showDefaultView() {
      clearRoute();
      renderDefaultMarkers();
      document.getElementById('showAllBtn').style.display = 'none';
      document.getElementById('routeResults').innerHTML = `<div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">Filter by client and date range, then click "Trace Route" to draw each client's path on the map.</div>`;
    }

    function fetchRoute(params) {
      const resultsEl = document.getElementById('routeResults');
      resultsEl.innerHTML = '<div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">Loading...</div>';

      fetch(`/api/route-search/?${params}`)
        .then(r => r.json())
        .then(data => {
          clearRoute();
          defaultMarkers.forEach(m => map.removeLayer(m));

          if (!data.routes || data.routes.length === 0) {
            resultsEl.innerHTML = '<div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">No location data found for the selected filters.</div>';
            return;
          }

          const allBounds = [];
          let html = '';

          data.routes.forEach(route => {
            const color = route.color;
            const latlngs = route.points.map(p => [p.lat, p.lng]);

            const polyline = L.polyline(latlngs, {
              color: color, weight: 3, opacity: 0.7
            }).addTo(map);
            routeLayers.push(polyline);

            route.points.forEach((p, idx) => {
              const isFirst = idx === 0;
              const isLast = idx === route.points.length - 1;
              const marker = L.circleMarker([p.lat, p.lng], {
                color: color, fillColor: isFirst ? '#fff' : color,
                fillOpacity: isFirst ? 1 : 0.7, radius: isFirst ? 8 : 5, weight: 2
              }).addTo(map);

              const popupHtml = `
                <div class="popup">
                  <div class="name">${route.name} ${isFirst ? '(start)' : isLast ? '(end)' : '#' + (idx+1)}</div>
                  <div class="row"><span class="k">Position</span><span class="v">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span></div>
                  <div class="row"><span class="k">Time</span><span class="v">${fmtTime(p.timestamp)}</span></div>
                  <div class="row"><span class="k">Received</span><span class="v">${fmtTime(p.received_at)}</span></div>
                  <div class="row"><span class="k">Trigger</span><span class="v">${p.triggered_by || '—'}</span></div>
                  <div class="row"><span class="k">Source</span><span class="v"><span class="badge ${p.location_source || 'gps'}">${p.location_source === 'google_wifi' ? 'Google WiFi' : 'GPS'}</span></span></div>
                </div>`;
              marker.bindPopup(popupHtml, { minWidth: 220 });
              routeMarkers.push(marker);
              allBounds.push([p.lat, p.lng]);
            });

            html += `<div class="item">
              <div class="title"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:6px"></span>${route.name}</div>
              <div class="sub">${route.points.length} points</div>
            </div>`;
          });

          resultsEl.innerHTML = html + `<div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">${data.total_points} total points across ${data.routes.length} client(s)</div>`;

          if (allBounds.length === 1) map.setView(allBounds[0], 15);
          else if (allBounds.length > 1) map.fitBounds(allBounds, { padding: [60, 60] });

          document.getElementById('showAllBtn').style.display = 'block';
        })
        .catch(err => {
          resultsEl.innerHTML = `<div style="padding:12px 16px;font-size:12px;color:var(--danger)">Error: ${err.message}</div>`;
        });
    }

    document.getElementById('btnTraceRoute').onclick = () => {
      const params = new URLSearchParams();
      const device_id = document.getElementById('f_device').value;
      const date_from = document.getElementById('f_from').value;
      const date_to = document.getElementById('f_to').value;
      if (device_id) params.set('device_id', device_id);
      if (date_from) params.set('date_from', date_from);
      if (date_to) params.set('date_to', date_to);
      fetchRoute(params);
    };

    document.getElementById('btnFastRoute').onclick = () => {
      const params = new URLSearchParams();
      const device_id = document.getElementById('f_device').value;
      if (device_id) params.set('device_id', device_id);
      const now = new Date();
      const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      params.set('date_from', yesterday.toISOString());
      fetchRoute(params);
    };

    document.getElementById('btnClearRoute').onclick = showDefaultView;
    document.getElementById('showAllBtn').onclick = showDefaultView;

    // Sidebar toggle
    document.getElementById('toggleFilters').onclick = (e) => {
      e.preventDefault();
      document.body.classList.toggle('has-sidebar');
      map.invalidateSize();
    };
    document.getElementById('btnCloseSidebar').onclick = () => {
      document.body.classList.remove('has-sidebar');
      map.invalidateSize();
    };
  </script>
</body>
</html>
